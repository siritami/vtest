<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOZ</title>
<meta name="description" content="Diễn đàn VOZ — bản web dựng trên REST API của voz.vn">
<link rel="preconnect" href="https://data.voz.vn">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/theme.css">
<script>
  // Runs while the head is still parsing, before the layout stylesheets below and before
  // anything paints, so a dark-mode reader never sees a white flash. Kept inline and tiny:
  // only the attributes the CSS keys off, read straight from localStorage. base.css has
  // already declared the light values at this point, so setting data-theme here re-points
  // them in the same style recalculation as the first paint. Everything else lives in
  // ui/theme.js.
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('voz-settings:v1') || '{}');
      var mode = ['auto', 'light', 'dark'].indexOf(s.theme) >= 0 ? s.theme : 'auto';
      var dark = mode === 'dark' ||
        (mode === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var r = document.documentElement;
      r.dataset.themeMode = mode;
      r.dataset.theme = dark ? 'dark' : 'light';
      // Family stacks mirror FONT_STACKS in lib/settings.js; only base.css's --font default
      // is overridden, and fonts.css is left to be linked lazily by ui/theme.js.
      if (s.font) {
        r.dataset.font = s.font;
        if (s.font === 'roboto') r.style.setProperty('--font', 'Roboto, "Segoe UI", "Helvetica Neue", Arial, sans-serif');
        else if (s.font === 'be-vietnam-pro') r.style.setProperty('--font', '"Be Vietnam Pro", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif');
      }
    } catch (e) { /* storage disabled: fall through to the light default */ }
  })();
</script>
<link rel="stylesheet" href="/assets/css/layout.css">
<link rel="stylesheet" href="/assets/css/forum.css">
<link rel="stylesheet" href="/assets/css/avatar.css">
<link rel="stylesheet" href="/assets/css/post.css">
<link rel="stylesheet" href="/assets/css/media.css">
<link rel="stylesheet" href="/assets/css/reaction.css">
<link rel="stylesheet" href="/assets/css/forms.css">
<link rel="stylesheet" href="/assets/css/editor.css">
<link rel="stylesheet" href="/assets/css/account.css">
<link rel="stylesheet" href="/assets/css/misc.css">
<link rel="stylesheet" href="/assets/css/responsive.css">
<link rel="stylesheet" href="/assets/css/headerMenus.css">
<link rel="stylesheet" href="/assets/css/home.css">
<link rel="stylesheet" href="/assets/css/settings.css">
<link rel="stylesheet" href="/assets/css/stickers.css">
</head>
<body>
