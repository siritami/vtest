<script>
  // Runs while the head is still parsing, before the layout stylesheets below and before
  // anything paints, so a dark-mode reader never sees a white flash. Kept inline and tiny:
  // only the attributes the CSS keys off, read straight from localStorage. base.css has
  // already declared the light values at this point, so setting data-theme here re-points
  // them in the same style recalculation as the first paint. Everything else lives in
  // ui/theme.js.
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('voz-settings:v1') || '{}');
      var mode = ['auto', 'light', 'dark'].indexOf(s.theme) >= 0 ? s.theme : 'auto';
      var dark = mode === 'dark' ||
        (mode === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var r = document.documentElement;
      r.dataset.themeMode = mode;
      r.dataset.theme = dark ? 'dark' : 'light';
      // Family stacks mirror FONT_STACKS in lib/settings.js. The default is `be-vietnam`, whose
      // face font-default.css already declared above, so base.css's --font is correct without
      // touching it here. Only a *different* vendored family needs --font set; fonts.css itself
      // is linked by ui/theme.js once it knows the choice, so nothing extra is fetched for the
      // default. Values that are not a known key fall back to the default, matching
      // normalizeSettings().
      var FONT_STACKS = {
        system: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
        roboto: 'Roboto, "Segoe UI", "Helvetica Neue", Arial, sans-serif',
        cantarell: '"Cantarell", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
        'be-vietnam-pro': '"Be Vietnam Pro", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
        'sf-pro-display': '"SF Pro Display", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
        'segoe-ui': '"Segoe UI Local", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
      };
      var font = Object.prototype.hasOwnProperty.call(FONT_STACKS, s.font) ? s.font : 'be-vietnam';
      r.dataset.font = font;
      // The default is already applied by base.css, so its inline value is cleared rather than
      // duplicated; every other choice — including `system`, which must not inherit the
      // vendored default from base.css — needs its own stack set here.
      if (font === 'be-vietnam') r.style.removeProperty('--font');
      else r.style.setProperty('--font', FONT_STACKS[font]);
              // Font size percentages. Applied pre-paint so a non-default size never flashes the
              // stock one; mirrored by applyFontScale() in ui/theme.js.
              var scale = function (v) {
                var isText = typeof v === 'string';
                if (isText && v.trim() === '') return 100;
                if (!isText && typeof v !== 'number') return 100;
                var n = Number(v);
                if (!isFinite(n)) return 100;
                n = Math.round(n / 5) * 5;
                return Math.min(200, Math.max(80, n));
              };
              r.style.setProperty('--post-scale', String(scale(s.postSize) / 100));
              r.style.setProperty('--ui-scale', String(scale(s.uiSize) / 100));
            } catch (e) { /* storage disabled: fall through to the light default */ }
  })();
</script>
